<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Dashboard — meteomayenne.fr</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0d14;
      --surface: #12151f;
      --card:    #181c2a;
      --card2:   #1e2235;
      --border:  #252a3f;
      --accent:  #6c63ff;
      --green:   #00d4aa;
      --red:     #ff5c72;
      --text:    #e2e8f0;
      --muted:   #8892b0;
      --radius:  14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HERO HEADER ─────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #0f1225 0%, #1a1040 50%, #0f1225 100%);
      border-bottom: 1px solid var(--border);
      padding: 36px 40px 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .hero-icon {
      width: 52px; height: 52px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--green));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(108,99,255,0.35);
    }
    .hero-title { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em; }
    .hero-sub   { color: var(--muted); font-size: 0.9rem; margin-top: 3px; }
    .hero-date {
      margin-left: auto; flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.82rem; color: var(--muted);
    }
    .hero-date strong { color: var(--text); }

    /* ── STAT STRIP ──────────────────────────────── */
    .stat-strip {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 40px 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 700px) { .stat-strip { grid-template-columns: repeat(2,1fr); } }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .stat-card.total::after   { background: var(--accent); }
    .stat-card.indexed::after { background: var(--green); }
    .stat-card.notidx::after  { background: var(--red); }
    .stat-card.pct::after     { background: linear-gradient(90deg, var(--accent), var(--green)); }

    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-val   { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .stat-card.total   .stat-val { color: var(--accent); }
    .stat-card.indexed .stat-val { color: var(--green); }
    .stat-card.notidx  .stat-val { color: var(--red); }
    .stat-card.pct     .stat-val {
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── MAIN CONTENT ────────────────────────────── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 40px 48px;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 860px) { .main { grid-template-columns: 1fr; padding: 20px; } }
    @media (max-width: 700px) { .stat-strip { padding: 20px 20px 0; } .hero { padding: 24px 20px; } }

    /* ── URL LIST ────────────────────────────────── */
    .list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .list-head-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .list-count {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 10px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab.active.green-tab { border-bottom-color: var(--green); color: var(--green); }
    .tab.active.red-tab   { border-bottom-color: var(--red);   color: var(--red); }

    #url-list {
      list-style: none;
      max-height: 520px;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #url-list::-webkit-scrollbar { width: 4px; }
    #url-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .url-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .url-item:hover { background: var(--card2); border-color: var(--border); }
    .url-item.indexed     { border-left: 3px solid var(--green); }
    .url-item.not-indexed { border-left: 3px solid var(--red); }
    .url-item.priority    { background: rgba(245,158,11,0.06); border-left: 3px solid #f59e0b !important; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .indexed     .status-dot { background: var(--green); }
    .not-indexed .status-dot { background: var(--red); }

    .btn-priority {
      background: none; border: none; font-size: 1rem; cursor: pointer;
      padding: 0 2px; line-height: 1; flex-shrink: 0;
      color: var(--border); transition: color 0.15s, transform 0.15s;
    }
    .btn-priority:hover       { color: #f59e0b; transform: scale(1.2); }
    .btn-priority.on          { color: #f59e0b; }
    .tab.active.orange-tab    { border-bottom-color: #f59e0b; color: #f59e0b; }

    .url-slug {
      flex: 1;
      font-size: 0.83rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .url-badge {
      font-size: 0.7rem; font-weight: 700;
      padding: 2px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
      border: 1px solid transparent;
    }
    .url-badge:hover { opacity: 0.75; transform: scale(0.96); }
    .indexed     .url-badge { background: rgba(0,212,170,0.12); color: var(--green); border-color: rgba(0,212,170,0.25); }
    .not-indexed .url-badge { background: rgba(255,92,114,0.12); color: var(--red);   border-color: rgba(255,92,114,0.25); }

    /* ── Search ── */
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .search-icon { color: var(--muted); font-size: 0.95rem; flex-shrink: 0; }
    .search-wrap input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 0.88rem;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-clear {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.85rem; padding: 0 2px; line-height: 1;
      display: none; transition: color 0.15s;
    }
    .search-clear:hover { color: var(--red); }
    .search-clear.visible { display: block; }

    .empty-state {
      text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem;
    }

    /* ── RIGHT SIDEBAR ───────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 18px; }

    .side-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .side-title {
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 16px;
    }

    /* Donut */
    .donut-wrap { display: flex; flex-direction: column; align-items: center; }
    .donut-container { position: relative; width: 160px; height: 160px; }
    .donut-container svg { transform: rotate(-90deg); }
    .donut-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); text-align: center;
    }
    .donut-pct {
      font-size: 2rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .donut-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

    .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; width: 100%; }
    .legend-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.8rem;
    }
    .legend-left { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-count { font-weight: 700; }

    /* Mini bar */
    .mini-bar-wrap { margin-top: 18px; }
    .mini-bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--muted); margin-bottom: 6px;
    }
    .mini-bar-bg {
      background: var(--card2); border-radius: 6px; height: 8px; overflow: hidden;
    }
    .mini-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--accent));
      border-radius: 6px;
      transition: width 0.6s ease;
    }
  </style>
</head>

  // Load overrides and priorities from localStorage, fall back to PRELOADED
  const savedOverrides  = JSON.parse(localStorage.getItem('seo_overrides')  || '{}');
  const savedPriorities = JSON.parse(localStorage.getItem('seo_priorities') || '[]');

  const urls = PRELOADED.map(([url, status]) => ({
    url,
    status:   savedOverrides[url] || status,
    priority: savedPriorities.includes(url),
  }));

  function saveOverrides() {
    const overrides = {};
    urls.forEach(u => { overrides[u.url] = u.status; });
    localStorage.setItem('seo_overrides', JSON.stringify(overrides));
  }

  function savePriorities() {
    localStorage.setItem('seo_priorities', JSON.stringify(
      urls.filter(u => u.priority).map(u => u.url)
    ));
  }

  function toggleStatus(item) {
    item.status = item.status === 'indexed' ? 'not-indexed' : 'indexed';
    saveOverrides();
    renderList();
    updateStats();
  }

  function togglePriority(item) {
    item.priority = !item.priority;
    savePriorities();
    renderList();
  }

  let currentFilter = 'all';

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  function slug(url) {
    return url.replace('https://meteomayenne.fr/', '/');
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('visible');
    renderList();
  }

  function renderList() {
    const list = document.getElementById('url-list');
    const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
    document.getElementById('search-clear').classList.toggle('visible', query.length > 0);

    let filtered = currentFilter === 'priority'
      ? urls.filter(u => u.priority)
      : currentFilter === 'all' ? urls : urls.filter(u => u.status === currentFilter);
    if (query) filtered = filtered.filter(u => u.url.toLowerCase().includes(query));
    document.getElementById('list-count').textContent = filtered.length + ' pages';

    if (filtered.length === 0) {
      list.innerHTML = '<li class="empty-state">Aucune page dans cette catégorie.</li>';
      return;
    }
    list.innerHTML = '';
    filtered.forEach(item => {
      const li = document.createElement('li');
      li.className = 'url-item ' + item.status;
      li.title = 'Cliquer pour ouvrir — cliquer sur le badge pour changer le statut';
      const badgeLabel = item.status === 'indexed' ? '✓ Indexée' : '✗ Non indexée';
      if (item.priority) li.classList.add('priority');
      li.innerHTML = `
        <button class="btn-priority ${item.priority ? 'on' : ''}" title="${item.priority ? 'Retirer la priorité' : 'Marquer comme priorité'}">⭐</button>
        <div class="status-dot"></div>
        <span class="url-slug" title="${item.priority ? '🔍 Vérifier sur Google : site:' + item.url : '🔗 Ouvrir ' + item.url}">${slug(item.url)}</span>
        <span class="url-badge" title="Cliquer pour basculer le statut">${badgeLabel}</span>
      `;
      li.querySelector('.btn-priority').addEventListener('click', e => {
        e.stopPropagation();
        togglePriority(item);
      });
      li.querySelector('.url-badge').addEventListener('click', e => {
        e.stopPropagation();
        toggleStatus(item);
      });
      li.querySelector('.url-slug').addEventListener('click', () => {
        if (item.priority) {
          window.open('https://www.google.com/search?q=site:' + item.url.replace('https://', ''), '_blank');
        } else {
          window.open(item.url, '_blank');
        }
      });
      list.appendChild(li);
    });
  }

  function updateStats() {
    const total   = urls.length;
    const indexed = urls.filter(u => u.status === 'indexed').length;
    const notIdx  = urls.filter(u => u.status === 'not-indexed').length;
    const pct     = total > 0 ? Math.round((indexed / total) * 100) : 0;

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-indexed').textContent = indexed;
    document.getElementById('stat-not').textContent     = notIdx;
    document.getElementById('stat-pct').textContent     = pct + '%';
    document.getElementById('leg-indexed').textContent  = indexed;
    document.getElementById('leg-not').textContent      = notIdx;
    document.getElementById('mini-pct-label').textContent = pct + '%';
    document.getElementById('mini-bar').style.width     = pct + '%';

    const C = 2 * Math.PI * 60;
    const idxArc = total > 0 ? (indexed / total) * C : 0;
    const notArc = total > 0 ? (notIdx  / total) * C : 0;

    const dIdx = document.getElementById('donut-indexed');
    const dNot = document.getElementById('donut-not');
    dIdx.setAttribute('stroke-dasharray', `${idxArc} ${C - idxArc}`);
    dIdx.setAttribute('stroke-dashoffset', `${-notArc}`);
    dNot.setAttribute('stroke-dasharray', `${notArc} ${C - notArc}`);
    dNot.setAttribute('stroke-dashoffset', '0');

    document.getElementById('donut-pct').textContent = pct + '%';
  }

  updateStats();
  renderList();
</script>
